name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:         # manual run from the Actions tab
  push:
    branches: [main]

# Needed so the job can push generated files to the `output` branch
permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats table + chat line
        run: python3 scripts/generate_assets.py dist
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#DC143C&color_dots=#EBEDF0,#F4B6C2,#E8728A,#DC143C,#8B0A24
            dist/snake-dark.svg?color_snake=#DC143C&color_dots=#0A0A0A,#3A0A14,#6E0F25,#B01232,#DC143C

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
