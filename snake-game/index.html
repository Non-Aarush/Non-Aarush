<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Non-Aarush | Minecraft Snake</title>
<style>
@font-face{font-family:Monocraft;src:url(Monocraft.ttf)}
:root{--g:#55FF55;--r:#ff4d4d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Monocraft,monospace}
body{display:grid;place-items:center;min-height:100vh;padding:12px}
main{width:min(94vw,520px);border:1px solid var(--r);border-radius:10px;padding:14px;background:#050505;box-shadow:0 0 22px rgba(255,77,77,.35)}
.hud{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:10px;text-shadow:2px 2px #222}
.hud b{font-weight:400}
.y{color:#FFFF55}.a{color:#55FFFF}.g{color:var(--g)}.d{color:#AAAAAA}
canvas{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated;border:2px solid #1c1c1c;touch-action:none;background:#0d1f0a}
p{margin:10px 0 0;font-size:12px;color:#AAAAAA;text-align:center}
a{color:var(--g)}
</style>
</head>
<body>
<main>
  <div class="hud"><b class="g">[1127&#10026;] Snake</b><b>Score <span id="s" class="y">0</span></b><b>Best <span id="b" class="a">0</span></b><b>Lv <span id="l" class="g">1</span></b></div>
  <canvas id="c" aria-label="Snake game board"></canvas>
  <p>Arrows / WASD to move &middot; Space to pause &middot; Enter to restart &middot; swipe on mobile<br>Collect iron (1), gold (2), diamond (3) and emerald (5). Don't hit the walls or yourself.</p>
  <p><a href="https://github.com/Non-Aarush">&larr; back to the lobby</a></p>
</main>
<script>
const N=20,S=24,cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=cv.height=N*S;
const RES=[{c:'#d8d8d8',p:1,w:6},{c:'#FFAA00',p:2,w:3},{c:'#55FFFF',p:3,w:2},{c:'#55FF55',p:5,w:1}];
const $=id=>document.getElementById(id);
let best=0;try{best=+localStorage.getItem('mcsnake')||0}catch(e){}
let snake,dir,q,food,score,grow,state='ready',timer;
const lvl=()=>1+Math.floor(score/10), speed=()=>Math.max(55,150-lvl()*9);
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};q=[];score=0;grow=0;spawn();hud()}
function spawn(){let tot=RES.reduce((a,r)=>a+r.w,0),n=Math.random()*tot,res=RES[0];for(const r of RES){if((n-=r.w)<0){res=r;break}}
  do{food={x:Math.random()*N|0,y:Math.random()*N|0,r:res}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function hud(){$('s').textContent=score;$('b').textContent=best;$('l').textContent=lvl()}
function loop(){clearTimeout(timer);if(state!=='play')return;step();draw();timer=setTimeout(loop,speed())}
function step(){const d=q.shift()||dir;dir=d;const h={x:snake[0].x+d.x,y:snake[0].y+d.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some((s,i)=>i<snake.length-(grow?0:1)&&s.x===h.x&&s.y===h.y))return over();
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score+=food.r.p;grow+=food.r.p-1;spawn();if(score>best){best=score;try{localStorage.setItem('mcsnake',best)}catch(e){}}hud()}
  else if(grow>0)grow--;else snake.pop()}
function over(){state='over';draw()}
function turn(x,y){if(state==='ready'||state==='over'){start()}
  const last=q.length?q[q.length-1]:dir;if(last.x===-x&&last.y===-y||last.x===x&&last.y===y)return;if(q.length<3)q.push({x,y})}
function start(){if(state==='over'||state==='ready')reset();state='play';loop()}
function pause(){if(state==='play'){state='pause';draw()}else if(state==='pause'){state='play';loop()}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
  if(m){e.preventDefault();turn(...m)}else if(k===' '){e.preventDefault();pause()}else if(k==='enter'){reset();state='play';loop()}});
let t0=null;cv.addEventListener('touchstart',e=>{t0=e.touches[0];if(state!=='play')start()},{passive:true});
cv.addEventListener('touchend',e=>{if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;
  if(Math.max(Math.abs(dx),Math.abs(dy))>20)Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy));t0=null});
cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
const px=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
function text(t,y,c,sz){ctx.font=sz+'px Monocraft, monospace';ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(t,N*S/2+2,y+2);ctx.fillStyle=c;ctx.fillText(t,N*S/2,y)}
function draw(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const a=(x+y)%2?'#1f4a18':'#255a1c';px(x*S,y*S,S,S,a);
    const h=(x*73+y*151)%7;if(h<3)px(x*S+4+h*5,y*S+6+h*4,3,3,'#2d6d22')}
  snake.forEach((s,i)=>{const X=s.x*S,Y=s.y*S;px(X+1,Y+1,S-2,S-2,i%2?'#2fa82f':'#3fc13f');px(X+3,Y+3,S-6,S-6,i%2?'#38b838':'#49d049')});
  const h=snake[0],X=h.x*S,Y=h.y*S;px(X,Y,S,S,'#55FF55');px(X+3,Y+3,S-6,S-6,'#49d049');
  px(X+4,Y+6,5,5,'#0a2a0a');px(X+15,Y+6,5,5,'#0a2a0a');px(X+10,Y+11,4,4,'#0a2a0a');px(X+7,Y+14,3,6,'#0a2a0a');px(X+14,Y+14,3,6,'#0a2a0a');
  const f=food,fx=f.x*S,fy=f.y*S;px(fx+4,fy+4,S-8,S-8,'#000');px(fx+5,fy+5,S-10,S-10,f.r.c);px(fx+7,fy+7,4,4,'#fff');px(fx+S-12,fy+S-11,4,4,'rgba(0,0,0,.35)');
  if(state!=='play'){px(0,0,N*S,N*S,'rgba(0,0,0,.62)');
    if(state==='ready'){text('MINECRAFT SNAKE',210,'#55FF55',30);text('Press an arrow key or tap',260,'#fff',16)}
    if(state==='pause'){text('PAUSED',250,'#FFFF55',34)}
    if(state==='over'){text('BED DESTROYED!',200,'#FF5555',32);text('FINAL KILL: '+score,250,'#55FFFF',20);text('Enter or tap to retry',295,'#fff',16)}}}
reset();draw();
</script>
</body>
</html>
